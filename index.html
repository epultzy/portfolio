<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Your Name</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Music -->
    <audio id="bgMusic" loop preload="auto">
        <source src="assets/music/background.mp3" type="audio/mpeg">
        Your browser does not support audio playback.
    

    <!-- Music Control Button -->
    <button id="musicBtn" class="music-btn">🔊 Play Music</button>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <h2 class="logo">YourName</h2>
            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <div class="container">
            <h1>Hello, I'm <span class="name">Your Name</span></h1>
            <p class="title">Web Developer & Data Analyst</p>
            <p>I build efficient, clean, and user-friendly digital solutions.</p>
            <a href="#projects" class="btn">View My Work</a>
        </div>
    </header>

    <!-- About Section -->
    <section id="about" class="section">
        <div class="container">
            <h2 class="section-title">About Me</h2>
            <p>I am a dedicated developer with experience in web development and data analysis. I specialize in building management systems, responsive websites, and data-driven reports. I write clean, maintainable code and focus on delivering practical solutions.</p>
        </div>
    </section>

    <!-- Skills Section -->
    <section id="skills" class="section bg-light">
        <div class="container">
            <h2 class="section-title">Technical Skills</h2>
            <div class="skills-grid">
                <div class="skill-card">HTML5</div>
                <div class="skill-card">CSS3</div>
                <div class="skill-card">JavaScript</div>
                <div class="skill-card">Python</div>
                <div class="skill-card">PHP</div>
                <div class="skill-card">MySQL</div>
                <div class="skill-card">Git & GitHub</div>
                <div class="skill-card">Data Analysis</div>
            </div>
        </div>
    </section>

    <!-- Projects Section -->
    <section id="projects" class="section">
        <div class="container">
            <h2 class="section-title">My Projects</h2>
            <div class="projects-grid">
                <div class="project-card">
                    <h3>Inventory Management System</h3>
                    <p>Web application to track stock, sales, and generate automatic reports.</p>
                    <span class="tech">PHP • MySQL • Bootstrap</span>
                    <br>
                    <a href="#" class="btn-sm">View Details</a>
                    <a href="https://github.com/yourusername/inventory-system" class="btn-sm">Source Code</a>
                </div>

                <div class="project-card">
                    <h3>Sales Data Analysis</h3>
                    <p>Analyze sales trends and visualize business performance using Python.</p>
                    <span class="tech">Python • Pandas • Matplotlib</span>
                    <br>
                    <a href="#" class="btn-sm">View Details</a>
                    <a href="https://github.com/yourusername/sales-analysis" class="btn-sm">Source Code</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="section bg-light">
        <div class="container">
            <h2 class="section-title">Get In Touch</h2>
            <p>Email: your.email@example.com</p>
            <p>LinkedIn: linkedin.com/in/yourprofile</p>
            <p>GitHub: github.com/yourusername</p>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Your Name. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
